spring.application.name=dziennik-zdrowia-backend
server.port=8080

# Adresy frontendu, ktore moga wolac API (oddzielone przecinkami).
# Domyslnie typowe porty dev: Vite (5173), React/Next (3000), Angular (4200).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:4200}

management.endpoints.web.exposure.include=health,info
