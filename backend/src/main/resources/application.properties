spring.application.name=dziennik-zdrowia-backend
server.port=8080

# Adresy frontendu, ktore moga wolac API (oddzielone przecinkami).
# Domyslnie typowe porty dev: Vite (5173), React/Next (3000), Angular (4200).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:4200}

management.endpoints.web.exposure.include=health,info

# Lokalne zmienne (DB_PASSWORD, GOOGLE_CLIENT_ID...) z pliku .env w glownym katalogu repo
# (wzor: .env.example). Dwie sciezki, bo backend bywa uruchamiany z backend/ albo z katalogu repo.
# Zmienne srodowiskowe maja pierwszenstwo przed .env.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# Baza danych (PostgreSQL). Haslo tylko z DB_PASSWORD - bez wartosci domyslnej w repo.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/dziennik_zdrowia}
spring.datasource.username=${DB_USERNAME:dziennik}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false

# Logowanie Google. Ten sam Client ID co VITE_GOOGLE_CLIENT_ID na froncie.
# Client secret NIE jest potrzebny: weryfikujemy ID token kluczami publicznymi Google.
app.google.client-id=${GOOGLE_CLIENT_ID:}

# Ciasteczko sesji. Na produkcji (HTTPS) ustaw SESSION_COOKIE_SECURE=true.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.timeout=${SESSION_TIMEOUT:7d}

# Nie wysylaj stack trace'ow w odpowiedziach (devtools domyslnie je wlacza).
server.error.include-stacktrace=never
